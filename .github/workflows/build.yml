name: Build

on:
  push:
    branches: [main]
  schedule:
    # Weekly and manual rebuilds skip the cache to pick up Debian and Ruby image security patches.
    # The job runs every Monday 03:15 UTC
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-ruby:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      IMAGE: ghcr.io/blish/ruby
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          target: runtime
          tags: ${{ env.IMAGE }}:${{ matrix.ruby }}
          platforms: linux/amd64
          build-args: RUBY_VERSION=${{ matrix.ruby }}
          labels: org.opencontainers.image.source=https://github.com/blish/ruby-docker
          push: ${{ env.PUSH == 'true' }}
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=${{ matrix.ruby }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ruby }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          target: build
          tags: ${{ env.IMAGE }}:${{ matrix.ruby }}-build
          platforms: linux/amd64
          build-args: RUBY_VERSION=${{ matrix.ruby }}
          labels: org.opencontainers.image.source=https://github.com/blish/ruby-docker
          push: ${{ env.PUSH == 'true' }}
          pull: true
          # only rebuild the build stage, because runtime was cached in the step before
          no-cache-filters: ${{ github.event_name != 'push' && 'build' || '' }}
          cache-from: type=gha,scope=${{ matrix.ruby }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ruby }}
